name: Build and release installer ISO

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0 or nightly)'
        required: true
        default: 'nightly'
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'false'

  schedule:
    - cron: '0 3 * * 1'

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download Guix binary from ftp.gnu.org (reliable) with retries,
      # then run the official guix-install.sh which creates build users
      # and registers + starts the systemd unit.
      - name: Install Guix
        run: |
          set -euo pipefail

          # Find latest stable version
          GUIX_VER=$(curl -fsSL https://ftp.gnu.org/gnu/guix/ \
            | grep -oP 'guix-binary-\K[0-9]+\.[0-9]+\.[0-9]+' \
            | sort -V | tail -1)
          URL="https://ftp.gnu.org/gnu/guix/guix-binary-${GUIX_VER}.x86_64-linux.tar.xz"
          echo "Downloading Guix ${GUIX_VER} from ${URL}"

          for attempt in 1 2 3 4 5; do
            echo "Download attempt $attempt…"
            if wget -q --tries=1 --timeout=120 "$URL" -O /tmp/guix-binary.tar.xz; then
              echo "Download succeeded."
              break
            fi
            [[ $attempt -eq 5 ]] && { echo "All attempts failed."; exit 1; }
            WAIT=$(( 15 * (2 ** (attempt - 1)) ))
            echo "Retrying in ${WAIT}s…"; sleep "$WAIT"
          done

          # Extract
          sudo tar --warning=no-timestamp -xf /tmp/guix-binary.tar.xz -C /
          rm /tmp/guix-binary.tar.xz

          # Create build group and users
          sudo groupadd --system guixbuild 2>/dev/null || true
          for i in $(seq -w 1 10); do
            sudo useradd -r -g guixbuild -G guixbuild \
              -d /var/empty -s "$(which nologin)" \
              -c "Guix build user $i" --system "guixbuilder${i}" 2>/dev/null || true
          done

          # Reload systemd and start daemon via the unit file shipped in the tarball
          sudo systemctl daemon-reload
          sudo systemctl start guix-daemon
          sudo systemctl is-active guix-daemon

          # Authorise substitute server
          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive \
            --authorize < /var/guix/profiles/per-user/root/current-guix/share/guix/ci.guix.gnu.org.pub

          echo "/var/guix/profiles/per-user/root/current-guix/bin" >> "$GITHUB_PATH"
          echo "GUIX_PROFILE=/var/guix/profiles/per-user/root/current-guix" >> "$GITHUB_ENV"
          echo "LANG=en_US.utf8" >> "$GITHUB_ENV"
        timeout-minutes: 20

      - name: Cache Guix store
        uses: actions/cache@v4
        with:
          path: /gnu/store
          key: guix-store-${{ runner.os }}-${{ hashFiles('install.scm') }}-${{ github.run_id }}
          restore-keys: |
            guix-store-${{ runner.os }}-${{ hashFiles('install.scm') }}-
            guix-store-${{ runner.os }}-

      - name: Free up disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          df -h

      # guix system image writes a `result` symlink; run as root for daemon access.
      - name: Build installer ISO
        run: |
          sudo --preserve-env=GUIX_PROFILE,LANG,HOME,PATH \
            /var/guix/profiles/per-user/root/current-guix/bin/guix system image \
            --no-offload \
            -t iso9660 \
            install.scm
          sudo cp -L result brave-origin-installer.iso
          sudo chown "$(id -u):$(id -g)" brave-origin-installer.iso
          echo "ISO size: $(du -sh brave-origin-installer.iso | cut -f1)"
        timeout-minutes: 120

      - name: Generate SHA-256 checksum
        run: sha256sum brave-origin-installer.iso | tee brave-origin-installer.iso.sha256

      - name: Set release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Brave Origin Guix Installer ${{ steps.tag.outputs.tag }}
          prerelease: >-
            ${{
              github.event_name == 'schedule' ||
              (github.event_name == 'workflow_dispatch' && inputs.prerelease == 'true')
            }}
          body: |
            ## Brave Origin Guix System Installer ISO

            Custom Guix System installer with Brave Origin (nightly) pre-configured.

            ### What's included
            - Brave Origin channel pre-seeded at `/etc/channels.scm`
            - One-command installer: `bash /etc/brave-origin-templates/brave-origin-install /dev/sdX`
            - Templates at `/etc/brave-origin-templates/`

            ### Write to USB
            ```sh
            sudo dd if=brave-origin-installer.iso of=/dev/sdX bs=4M status=progress oflag=sync
            ```

            ### Verify
            ```sh
            sha256sum -c brave-origin-installer.iso.sha256
            ```
          files: |
            brave-origin-installer.iso
            brave-origin-installer.iso.sha256
