name: Build and release installer ISO

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0 or nightly)'
        required: true
        default: 'nightly'
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'false'

  schedule:
    - cron: '0 3 * * 1'

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the Guix release tarball and run guix-daemon as root.
      #
      # Why the earlier attempts never got a daemon:
      #  * `sudo guix-daemon ... &>/var/log/guix-daemon.log &` — the redirect
      #    is opened by the *runner's* (non-root) shell, so it fails with
      #    "Permission denied" and guix-daemon is never started.
      #  * `systemctl start guix-daemon` — the tarball only ships the unit
      #    under current-guix/lib/systemd/system; nothing installs it, hence
      #    "Unit guix-daemon.service not found".  (And the 1.5.0 unit runs the
      #    daemon as an unprivileged `guix-daemon` user, which needs a chowned
      #    store and unprivileged user namespaces that Ubuntu 24.04 restricts.)
      # So: classic root daemon with build users, started as a transient
      # systemd service (survives the end of this step, logs to the journal).
      - name: Install Guix
        env:
          GUIX_VER: '1.5.0'      # pinned: install.scm is tested against it
        run: |
          set -euo pipefail
          TARBALL="guix-binary-${GUIX_VER}.x86_64-linux.tar.xz"

          ok=
          for attempt in 1 2 3 4 5; do
            for mirror in https://ftpmirror.gnu.org/gnu https://ftp.gnu.org/gnu; do
              echo "Attempt $attempt: $mirror/guix/$TARBALL"
              if curl -fL --retry 2 --connect-timeout 30 --max-time 600 \
                   -o "/tmp/$TARBALL" "$mirror/guix/$TARBALL"; then
                ok=1; break 2
              fi
            done
            sleep $(( 15 * attempt ))
          done
          [[ -n "$ok" ]] || { echo "Could not download $TARBALL"; exit 1; }

          sudo tar --warning=no-timestamp -xf "/tmp/$TARBALL" -C /
          rm "/tmp/$TARBALL"
          GUIX=/var/guix/profiles/per-user/root/current-guix
          sudo mkdir -p /root/.config/guix
          sudo ln -sfn "$GUIX" /root/.config/guix/current

          sudo groupadd --system guixbuild
          for i in $(seq -w 1 10); do
            sudo useradd -g guixbuild -G guixbuild -d /var/empty \
              -s "$(command -v nologin)" -c "Guix build user $i" \
              --system "guixbuilder$i"
          done

          sudo systemd-run --unit=guix-daemon --description="GNU Guix build daemon" \
            --property=Environment=GUIX_LOCPATH=$GUIX/lib/locale \
            --property=Environment=LC_ALL=C.UTF-8 \
            "$GUIX/bin/guix-daemon" --build-users-group=guixbuild --discover=no \
            --substitute-urls="https://bordeaux.guix.gnu.org https://ci.guix.gnu.org"

          for i in $(seq 1 30); do
            [[ -S /var/guix/daemon-socket/socket ]] && break
            sleep 1
          done
          if ! [[ -S /var/guix/daemon-socket/socket ]]; then
            sudo systemctl status guix-daemon --no-pager || true
            sudo journalctl -u guix-daemon --no-pager || true
            exit 1
          fi
          sudo systemctl status guix-daemon --no-pager

          for key in bordeaux.guix.gnu.org ci.guix.gnu.org; do
            sudo "$GUIX/bin/guix" archive --authorize < "$GUIX/share/guix/$key.pub"
          done

          echo "$GUIX/bin" >> "$GITHUB_PATH"
          echo "GUIX_LOCPATH=$GUIX/lib/locale" >> "$GITHUB_ENV"
          "$GUIX/bin/guix" --version | head -1
        timeout-minutes: 20

      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h /

      # The daemon socket is world-writable, so no sudo is needed here.
      # `-L modules' puts this channel's (brave-origin ...) modules on the
      # load path.  `guix system image' prints the image's store file name.
      - name: Build live ISO
        run: |
          set -euo pipefail
          IMAGE=$(guix system image -t iso9660 -L modules \
                    --cores="$(nproc)" --max-jobs=2 install.scm | tail -1)
          echo "Built $IMAGE"
          cp "$IMAGE" brave-origin-installer.iso
          chmod 644 brave-origin-installer.iso
          ls -l brave-origin-installer.iso
          echo "ISO size: $(du -h brave-origin-installer.iso | cut -f1)"
        timeout-minutes: 150

      - name: Daemon log (on failure)
        if: failure()
        run: sudo journalctl -u guix-daemon --no-pager | tail -200 || true

      - name: Generate SHA-256 checksum
        run: sha256sum brave-origin-installer.iso | tee brave-origin-installer.iso.sha256

      - name: Set release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Brave Origin Guix Installer ${{ steps.tag.outputs.tag }}
          prerelease: >-
            ${{
              github.event_name == 'schedule' ||
              (github.event_name == 'workflow_dispatch' && inputs.prerelease == 'true')
            }}
          body: |
            ## Brave Origin Guix System Installer ISO

            Guix System live image: boots straight into Ratpoison (SLiM autologin
            as `guest`) with Brave Origin (nightly) installed and opened on login,
            plus the one-command installer.

            ### What's included
            - Live Ratpoison session (prefix `C-t`: `b` Brave Origin, `t` xterm)
            - Brave Origin + setuid `chrome-sandbox` via `brave-origin-service-type`
            - Brave Origin channel pre-seeded at `/etc/channels.scm`
            - One-command installer: `sudo brave-origin-install /dev/sdX` (`--help` for usage, `--dry-run` to preview)
            - Templates at `/etc/brave-origin-templates/`

            ### Write to USB
            ```sh
            sudo dd if=brave-origin-installer.iso of=/dev/sdX bs=4M status=progress oflag=sync
            ```

            ### Verify
            ```sh
            sha256sum -c brave-origin-installer.iso.sha256
            ```
          files: |
            brave-origin-installer.iso
            brave-origin-installer.iso.sha256
